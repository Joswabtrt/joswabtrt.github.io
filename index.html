<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENITH STORE — Донат магазин</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">ZENITH STORE</div>
        <div class="balances">
            <div class="balance-item">Баланс: <span id="zenith-balance">10 000</span> ZENITH</div>
            <div class="balance-item rub-balance">Баланс: <span id="rub-balance">500</span> ₽</div>
        </div>
    </header>

    <main>
        <section class="hero">
            <h1>MINECRAFT DONATE STORE</h1>
            <p>Покупайте привилегии за рубли или обменивайте внутриигровую валюту ZENITH!</p>
        </section>

        <!-- СЕКЦИЯ 1: ТОВАРЫ ЗА РУБЛИ -->
        <section class="shop-section">
            <h2>Привилегии за Рубли (₽)</h2>
            <div class="products-grid" id="rub-products">
                <!-- Сюда скрипт добавит товары за рубли -->
            </div>
        </section>

        <!-- СЕКЦИЯ 2: ТОВАРЫ ЗА ZENITH -->
        <section class="shop-section">
            <h2>Привилегии за ZENITH</h2>
            <div class="products-grid" id="zenith-products">
                <!-- Сюда скрипт добавит товары за ZENITH -->
            </div>
        </section>
    </main>

    <footer>
        <p>ZENITH STORE &copy; 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
