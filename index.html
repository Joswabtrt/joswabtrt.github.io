<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENSKY — Донат магазин</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <!-- Изменено название проекта на ZENSKY -->
        <div class="logo">ZENSKY STORE</div>
        <div class="balances">
            <div class="balance-item">Валюта: <span id="zenith-balance">0</span> ZENITH</div>
            <div class="balance-item rub-balance">Баланс: <span id="balance">0</span> ₽</div>
        </div>
    </header>

    <main>
        <section class="hero">
            <h1>ZENSKY DONATE STORE</h1>
            <p>Выберите желаемую привилегию. Покупка осуществляется за Рубли!</p>
        </section>

        <!-- Один общий контейнер для автоматического рендеринга товаров -->
        <section class="shop-section">
            <h2>Доступные привилегии</h2>
            <div class="products-grid" id="rub-products">
                <!-- Сюда скрипт автоматически добавит все 13 привилегий -->
            </div>
        </section>
    </main>

    <footer>
        <p>ZENSKY STORE &copy; 2026</p>
    </footer>

    <!-- Элемент для всплывающих уведомлений (toast) -->
    <div id="toast" style="display: none; position: fixed; bottom: 20px; right: 20px; background: #333; color: #fff; padding: 15px 20px; border-radius: 5px; z-index: 1000; box-shadow: 0 4px 6px rgba(0,0,0,0.2);"></div>

    <script src="script.js"></script>
</body>
</html>
