<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENSKY — Магазин честного доната</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем шрифты для стильного вида -->
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>
    <!-- Фоновое неоновое свечение -->
    <div class="glow-bg"></div>

    <header class="navbar">
        <div class="logo">ZENSKY<span>.RU</span></div>
        <div class="nav-links">
            <a href="#" class="active">Главная</a>
            <a href="#">Правила</a>
            <a href="#">Контакты</a>
        </div>
        <div class="user-balance">
            <span class="wallet-icon">₽</span> Баланс: <span id="balance">0</span> руб.
        </div>
    </header>

    <main class="container">
        <!-- Главный баннер -->
        <section class="hero-section">
            <h1 class="hero-title">ДОНАТ МАГАЗИН <span>ZENSKY</span></h1>
            <p class="hero-subtitle">Выбирай лучшие привилегии по самым доступным ценам на лучшем сервере!</p>
        </section>

        <!-- Сетка товаров (Привилегий) -->
        <section class="shop-section">
            <h2 class="section-title">Доступные привилегии</h2>
            <div class="products-grid" id="rub-products">
                <!-- Карточки генерируются скриптом автоматически -->
            </div>
        </section>
    </main>

    <!-- МОДАЛЬНОЕ ОКНО ОПЛАТЫ В СТИЛЕ EASYDONATE -->
    <div id="deposit-modal" class="modal" style="display: none;">
        <div class="modal-content animate-fade">
            <span class="close-modal" onclick="closeDepositModal()">&times;</span>
            <div class="modal-header">
                <h3>Оформление заказа</h3>
                <p>Вы приобретаете: <span id="selected-product-name" class="highlight">Товар</span></p>
            </div>
            
            <form id="easydonate-form" onsubmit="handlePaymentSubmit(event)">
                <!-- Ввод Никнейма -->
                <div class="input-block">
                    <label for="player-nickname">Ваш никнейм на сервере:</label>
                    <input type="text" id="player-nickname" placeholder="Введите ник" required>
                </div>

                <!-- Промокод -->
                <div class="input-block">
                    <label for="promo-code">Промокод (если есть):</label>
                    <input type="text" id="promo-code" placeholder="Введите купон">
                </div>

                <!-- Выбор метода оплаты (в стиле EasyDonate) -->
                <div class="payment-methods-label">Выберите способ оплаты:</div>
                <div class="payment-methods-grid">
                    <label class="method-card active">
                        <input type="radio" name="pay_method" value="sbp" checked>
                        <div class="method-icon sbp-icon">
                            <span class="sbp-badge">СБП</span>
                        </div>
                        <div class="method-title">Система Быстрых Платежей</div>
                    </label>
                    <label class="method-card">
                        <input type="radio" name="pay_method" value="card">
                        <div class="method-icon card-icon">💳</div>
                        <div class="method-title">Банковская карта</div>
                    </label>
                </div>

                <!-- Кнопка итоговой стоимости -->
                <button type="submit" class="easydonate-submit-btn">
                    Оплатить <span id="modal-total-price">0</span> ₽
                </button>
            </form>
        </div>
    </div>

    <!-- Всплывающие уведомления (Toast) -->
    <div id="toast" class="toast-notification" style="display: none;"></div>

    <script src="script.js"></script>
</body>
</html>
