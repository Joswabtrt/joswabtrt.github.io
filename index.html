<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENSKY — Магазин честного доната</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="logo">ZENSKY<span>.RU</span></div>
        <div class="nav-links">
            <a href="#" class="active">Главная</a>
            <a href="#">Правила</a>
            <a href="#">Контакты</a>
        </div>
        <div class="user-balance">
            Баланс: <span id="balance">0</span> руб.
        </div>
    </header>

    <main class="container">
        <!-- Кнопки выбора игровых режимов как на ReallyWorld -->
        <div class="rw-modes-nav">
            <div class="rw-modes-left">
                <h2>Магазин привилегий</h2>
            </div>
            <div class="rw-modes-right">
                <button class="mode-btn active">ГРИФ. ВЫЖИВАНИЕ</button>
                <button class="mode-btn">АНАРХИЯ</button>
                <button class="mode-btn">СТО</button>
            </div>
        </div>

        <section class="shop-section">
            <h3 class="section-subtitle">Доступные привилегии</h3>
            <div class="products-grid" id="rub-products">
                <!-- Карточки автоматически генерируются через script.js -->
            </div>
        </section>
    </main>

    <!-- МОДАЛЬНОЕ ОКНО ОПЛАТЫ EASYDONATE -->
    <div id="deposit-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close-modal" onclick="closeDepositModal()">&times;</span>
            <div class="modal-header">
                <h3>Оформление заказа</h3>
                <p>Вы приобретаете: <span id="selected-product-name" style="color:#b55fe6; font-weight:bold;">Товар</span></p>
            </div>
            
            <form onsubmit="handlePaymentSubmit(event)">
                <div class="input-block">
                    <label>Ваш никнейм на сервере *</label>
                    <input type="text" id="player-nickname" placeholder="Введите ник" required>
                </div>

                <div class="input-block">
                    <label>Промокод / Купон (если есть)</label>
                    <input type="text" id="promo-code" placeholder="Введите промокод">
                </div>

                <div class="payment-methods-label">Способ оплаты:</div>
                <div class="method-card active">
                    <span class="sbp-badge">СБП</span>
                    <div class="method-title">Система Быстрых Платежей</div>
                </div>

                <button type="submit" class="easydonate-submit-btn">
                    Оплатить <span id="modal-total-price">0</span> ₽
                </button>
            </form>
        </div>
    </div>

    <div id="toast" class="toast-notification" style="display: none;"></div>

    <script src="script.js"></script>
</body>
</html>
